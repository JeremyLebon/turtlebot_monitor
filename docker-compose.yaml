services:
  turtlebot-vis:
    #restart: always
    build:
      context: ./
      dockerfile: docker/Dockerfile
      # args:
      #   - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      #   - CYCLONEDDS_URI=file:///root/turtlebot3_ws/cylconedds_config.xml
    #image: nobel86/turtlebot-rpi5-vis:latest
    stdin_open: true
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    tty: true  
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=${XAUTH}
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///root/turtlebot3_ws/cylconedds_config.xml
      - FLASK_RUN_PORT=5000
      - SCAN_SUBNET=192.168.60.0/24
      - SCAN_INTERVAL=10
    container_name: turtlebot-monitor
    privileged: true
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: bash #python app.py
    ports:
      - "5000:5000"

