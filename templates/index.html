<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <title>Turtlebots Status</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <h1>Turtlebots Status</h1>
  <a href="/others" class="btn btn-secondary mb-3">Bekijk andere apparaten</a>
  <table class="table table-bordered align-middle">
    <thead class="table-dark">
      <tr>
        <th>Naam</th>
        <th>MAC</th>
        <th>IP</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      {% for name, bot in data.items() %}
      <tr>
        <td>{{ name }}</td>
        <td>{{ bot.mac }}</td>
        <td>{{ bot.ip or "-" }}</td>
        <td>
          {% if bot.status == "online" %}
            <span class="badge bg-success">Online</span>
          {% else %}
            <span class="badge bg-danger">Offline</span>
          {% endif %}
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
