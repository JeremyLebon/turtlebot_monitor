<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <title>Andere apparaten</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <h1>Andere apparaten op netwerk</h1>
  <a href="/" class="btn btn-primary mb-3">Terug naar Turtlebots</a>
  <table class="table table-bordered align-middle">
    <thead class="table-dark">
      <tr>
        <th>MAC</th>
        <th>IP</th>
        <th>Hostname</th>
      </tr>
    </thead>
    <tbody>
      {% for mac, dev in data.items() %}
      <tr>
        <td>{{ mac }}</td>
        <td>{{ dev.ip }}</td>
        <td>{{ dev.hostname or "-" }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
